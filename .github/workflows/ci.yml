name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 格式检查
        run: test -z "$(gofmt -l .)"
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试
        run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 构建跨平台产物
        run: make release
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  # 冒烟验证:在每个平台的真实 runner 上下载本次发布产物并运行,
  # 确认产物在目标平台能正常启动(arm64 macOS 经 Rosetta 跑 amd64 产物)。
  smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dockercn-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: dockercn-linux-arm64
          - os: macos-latest
            artifact: dockercn-darwin-arm64
          - os: macos-latest
            artifact: dockercn-darwin-amd64
          - os: windows-latest
            artifact: dockercn-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: 下载本平台产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "${{ github.repository }}" -p "${{ matrix.artifact }}"
      - name: 真实运行验证
        shell: bash
        run: |
          chmod +x "${{ matrix.artifact }}"
          ./"${{ matrix.artifact }}" version
          ./"${{ matrix.artifact }}" help
          # 真实请求一次 API,验证 TLS/网络链路在目标平台可用
          ./"${{ matrix.artifact }}" search node --platform linux/amd64 >/dev/null
